# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.d.s
long_name: Floating-Point Convert Single-Precision to Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The single-precision to double-precision conversion instruction, `fcvt.d.s` is encoded in the OP-FP
  major opcode space and both the source and destination are floating-point registers. The `xs2` field
  encodes the datatype of the source, and the `fmt` field encodes the datatype of the destination.
  `fcvt.d.s` will never round.
assembly: fd, fs1, rm
encoding:
  match: 010000100000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  if (MUTABLE_MISA_D && CSR[misa].D == 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  Bits<64> a = F[fs1];
  Bits<32> sp_value = a[31:0];
  # check for an incorrectly NaN-boxed input
  if (a[63:32] != 32'hffffffff) {
    sp_value = SP_CANONICAL_NAN;
  }
  F[fd] = f32_to_f64(sp_value);
  mark_f_state_dirty();
