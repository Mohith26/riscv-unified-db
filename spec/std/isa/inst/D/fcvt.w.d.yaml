# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.w.d
long_name: Floating-Point Convert Double-Precision to Word
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fcvt.w.d` instruction converts a double-precision floating-point number in floating-point register `fs1` to a
  signed 32-bit integer, in integer register `xd`.
assembly: xd, fs1, rm
encoding:
  match: 110000100000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  if (MUTABLE_MISA_D && CSR[misa].D == 0) {
    raise(ExceptionCode::IllegalInstruction, mode(), $encoding);
  }
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  Bits<64> a = F[fs1];
  X[xd] = $signed(f64_to_i32(a, rounding_mode));
